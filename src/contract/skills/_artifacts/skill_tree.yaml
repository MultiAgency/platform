    sources: ['MultiAgency/platform:src/contract/owner-client.ts', 'MultiAgency/platform:src/contract/owner-contract.ts', 'MultiAgency/platform:src/contract/owner-outputs.ts']
  - name: 'App server'
    slug: 'app-server'
    domain: 'app'
    path: skills/app-server/SKILL.md
    requires: ['getting-started', 'owner-workflows']
    sources: ['MultiAgency/platform:src/contract/app-client.ts', 'MultiAgency/platform:src/contract/app-access.ts', 'MultiAgency/platform:src/contract/app-consent.ts', 'MultiAgency/platform:docs/agent-access.md']
  - name: 'Payee workflows'
    slug: 'payee-workflows'
    domain: 'payee'
    path: skills/payee-workflows/SKILL.md
    requires: ['getting-started']
    sources: ['MultiAgency/platform:src/contract/client.ts', 'MultiAgency/platform:src/contract/agent-connection.ts', 'MultiAgency/platform:src/compensation-contract.ts', 'MultiAgency/platform:docs/agent-access.md']
