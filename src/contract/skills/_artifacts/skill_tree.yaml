library: { name: '@multiagency/sdk', version: '0.3.0' }
generated_from:
  domain_map: skills/_artifacts/domain_map.yaml
  skill_spec: skills/_artifacts/skill_spec.md
distribution: { mode: none }
skills:
  - name: 'Getting started'
    slug: 'getting-started'
    domain: 'access'
    path: skills/getting-started/SKILL.md
    sources: ['MultiAgency/platform:src/contract/index.ts', 'MultiAgency/platform:src/contract/payee-entry.ts', 'MultiAgency/platform:docs/agent-access.md']
  - name: 'Owner workflows'
    slug: 'owner-workflows'
    domain: 'owner'
    path: skills/owner-workflows/SKILL.md
